<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Estimation de projet · Evan Visions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg: #0A0A0B;
  --surface: #151517;
  --surface-2: #1D1D20;
  --line: #2C2C30;
  --text: #F5F4F0;
  --muted: #8E8E93;
  --accent: #D1A85E;
  --accent-text: #14120C;
  --success: #D1A85E;
  --radius: 999px;
  --radius-card: 20px;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

.app{
  max-width: 460px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 18px 20px 40px;
  display: flex;
  flex-direction: column;
}

/* ---- Desktop adaptation : l'outil devient une carte centrée plutôt qu'une page mobile étirée ---- */
@media (min-width: 640px){
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .app{
    max-width: 480px;
    width: 100%;
    min-height: auto;
    margin: 40px auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px 36px 36px;
    box-shadow: 0 40px 100px -30px rgba(0,0,0,0.7);
  }
}

/* ---- Top chrome ---- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom: 18px;
  min-height: 32px;
}
.back-btn{
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 18px;
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.brand-mini{
  display:flex;
  align-items:center;
  gap: 8px;
  margin-left:auto;
  text-decoration: none;
  cursor: pointer;
}
.brand-badge{
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter', sans-serif;
  font-weight: 800;
  font-size: 11px;
  flex-shrink: 0;
}
.brand-wordmark{
  font-family:'Inter', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1.2px;
  color: var(--text);
  text-transform: uppercase;
}

.progress{
  height: 4px;
  background: var(--surface-2);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 28px;
}
.progress-fill{
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s ease;
  width: 0%;
}

/* ---- Stage ---- */
.stage{
  flex: 1;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}

.question{
  font-size: 22px;
  font-weight: 700;
  line-height: 1.28;
  margin: 4px 0 6px;
}
.question::before{
  content: '✦ ';
  color: var(--accent);
}
.question-sub{
  font-size: 13px;
  color: var(--muted);
  line-height: 1.45;
  margin: 0 0 20px;
}

/* ---- Choice cards ---- */
.group-label{
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  font-weight: 700;
  margin: 20px 0 8px;
}
.group-label:first-of-type{ margin-top: 4px; }

.choice-card{
  display:flex;
  align-items:center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-card);
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  text-align: left;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.choice-card:active{ background: var(--surface-2); }
.choice-card.selected{
  border-color: var(--accent);
  background: var(--surface-2);
}
.choice-card .check{
  margin-left: auto;
  opacity: 0;
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
}
.choice-card.selected .check{ opacity: 1; }
.opt-price-tag{
  margin-left: auto;
  font-family:'Space Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  flex-shrink: 0;
  padding-left: 8px;
}
.choice-card.selected .opt-price-tag{ color: var(--success); }

/* ---- Mode picker ---- */
.mode-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.mode-card{
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-card);
  padding: 28px 12px;
  text-align: center;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
}
.mode-card:active{ background: var(--surface-2); }
.mode-card .emoji{
  font-size: 34px;
  display: block;
  margin-bottom: 10px;
}

/* ---- Segmented toggle ---- */
.segmented{
  display:flex;
  background: var(--surface-2);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 28px;
}
.segmented button{
  flex:1;
  padding: 11px;
  min-height: 42px;
  border:none;
  background: transparent;
  color: var(--muted);
  font-weight: 600;
  font-size: 13px;
  border-radius: 9px;
  cursor: pointer;
  font-family:'Inter', sans-serif;
}
.segmented button.active{
  background: var(--accent);
  color: #fff;
}

/* ---- Stepper ---- */
.stepper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 26px;
  margin: 26px 0 4px;
}
.stepper-btn{
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--surface);
  border: 1.5px solid var(--line);
  color: var(--text);
  font-size: 26px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor: pointer;
  user-select: none;
  font-weight: 400;
  line-height: 1;
}
.stepper-btn:active{ background: var(--accent); border-color: var(--accent); color:#fff; }
.stepper-value{
  font-family:'Space Mono', monospace;
  font-size: 38px;
  font-weight: 700;
  min-width: 90px;
  text-align: center;
  color: var(--text);
}
.stepper-unit{
  text-align:center;
  font-size: 13px;
  color: var(--muted);
  margin: 6px 0 24px;
}
.text-input{
  width: 100%;
  padding: 15px 16px;
  min-height: 52px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-card);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  margin-bottom: 8px;
}
.text-input::placeholder{ color: var(--muted); }
.text-input:focus{
  outline: none;
  border-color: var(--accent);
}
.note-textarea{
  min-height: 90px;
  resize: vertical;
  font-family: 'Inter', sans-serif;
  line-height: 1.4;
  padding-top: 13px;
}
.duration-convert{
  text-align:center;
  font-size: 13px;
  font-weight: 600;
  color: var(--success);
  margin: -14px 0 20px;
}

/* ---- Buttons ---- */
.btn-primary{
  display:block;
  width: 100%;
  padding: 16px;
  min-height: 52px;
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  border-radius: var(--radius);
  font-family:'Inter', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  text-align:center;
  text-decoration:none;
}
.btn-primary:active{ background: #B8925A; }
.btn-secondary{
  display:block;
  width: 100%;
  padding: 14px;
  min-height: 48px;
  background: transparent;
  color: var(--muted);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  font-family:'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  text-align:center;
}

/* ---- Final screen ---- */
.final-hero{
  text-align:center;
  padding: 10px 0 4px;
}
.final-label{
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 10px;
  font-weight: 700;
}
.final-price{
  font-family:'Space Mono', monospace;
  font-size: 38px;
  font-weight: 700;
  color: var(--success);
  line-height: 1.15;
  word-break: break-word;
}
@media (min-width: 380px){
  .final-price{ font-size: 44px; }
}
.final-confirm{
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.final-sub{
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 8px;
}
.final-note{
  text-align:center;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 12px;
  line-height: 1.5;
}
.detail-toggle{
  text-align:center;
  font-size: 13px;
  color: var(--muted);
  text-decoration: underline;
  margin-top: 22px;
  cursor: pointer;
}
.detail-box{
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--surface);
  border-radius: 12px;
  font-size: 12.5px;
}
.d-row{
  display:flex;
  justify-content:space-between;
  gap: 12px;
  padding: 6px 0;
  color: var(--muted);
  font-family:'Space Mono', monospace;
  font-size: 12.5px;
  border-bottom: 1px solid var(--line);
}
.d-row:last-child{ border-bottom: none; }
.d-row span:first-child{ flex-shrink: 0; }
.d-row span:last-child{ color: var(--text); text-align: right; }

.recap-box{
  margin-top: 22px;
  padding: 16px;
  background: var(--surface);
  border-radius: var(--radius-card);
}
.recap-title{
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 8px;
}

.evan-note{
  margin-top: 16px;
  padding: 16px;
  background: var(--surface-2);
  border-left: 3px solid var(--accent);
  border-radius: 10px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
}
.disclaimer-box{
  margin-top: 24px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--muted);
}
.evan-signature{
  margin-top: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  font-style: italic;
}

.restart-link{
  text-align:center;
  margin-top: 22px;
  font-size: 12.5px;
  color: var(--muted);
  text-decoration: underline;
  cursor: pointer;
}
.portfolio-link-final{
  display:block;
  text-align:center;
  margin-top: 16px;
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
}
.portfolio-link-final:hover{ text-decoration: underline; }
</style>
</head>

<script>

// un bijoutier/horloger haut de gamme et un petit artisan ébéniste n'ont ni le même budget,

  { value:'pme',     label:'PME / entreprise déjà établie',           mult:1.0  },

function typeNeedsPositioning(mode, typeValue){
  const types = mode === 'video' ? VIDEO_TYPES : PHOTO_TYPES;
  const t = types.find(x => x.value === typeValue);
  return t && t.group === 'Marques & entreprises';
}

const MIN_RETOUCH_FORFAIT = 40; // plancher pour une retouche photo seule, même sur un petit lot

// Coefficient régional appliqué à tous les tarifs de base (dayRate/unitRate).
// Evan exerce en Auvergne-Rhône-Alpes : les tarifs moyens en France sont ~15-25% en dessous
// de ceux pratiqués à Paris. -10% est un ajustement médian, à affiner si besoin
// (ex: 1 = tarifs Paris, 0.85-0.9 = grandes villes de région, 0.75-0.8 = zones rurales).
const REGIONAL_FACTOR = 0.90;

/* ============================================================
   STATE
   ============================================================ */

function freshState(){
  return {
    mode: null,
    service: 'full', // 'full' | 'shoot_only' | 'edit_only'
    type: null,
    positioning: 'pme',
    sector: '',
    otherDetails: '',
    hours: 8, // 8h = 1 jour de tournage/séance par défaut
    count: 1,
    usage: null,
    options: new Set(),
  };
}
let state = freshState();
let currentStep = 'mode';
let historyStack = [];

const STEP_ORDER = ['mode','service','type','otherDetails','positioning','sector','duration','count','usage','options','final'];

function formatDuration(hours){
  const days = Math.floor(hours / 8);
  const rem = hours % 8;
  if(days === 0) return hours + ' heure' + (hours > 1 ? 's' : '');
  if(rem === 0) return days + ' jour' + (days > 1 ? 's' : '');
  return days + ' jour' + (days > 1 ? 's' : '') + ' + ' + rem + ' heure' + (rem > 1 ? 's' : '');
}

function fmt(n){ return Math.round(n).toLocaleString('fr-FR'); }

// Arrondi "à la louche" pour la fourchette affichée en gros : volontairement peu précis pour
// que le prospect le lise comme une idée générale et non un montant figé auquel s'accrocher.
function roundRough(n){
  if(n < 150) return Math.round(n / 5) * 5;
  if(n < 500) return Math.round(n / 10) * 10;
  if(n < 2000) return Math.round(n / 25) * 25;
  return Math.round(n / 50) * 50;
}
function fmtRough(n){ return roundRough(n).toLocaleString('fr-FR'); }

/* ============================================================
   NAVIGATION
   ============================================================ */

const stage = document.getElementById('stage');
const backBtn = document.getElementById('backBtn');
const progressFill = document.getElementById('progressFill');

function goTo(step){
  historyStack.push(currentStep);
  currentStep = step;
  render();
}
function goBack(){
  if(historyStack.length === 0) return;
  currentStep = historyStack.pop();
  render();
}
backBtn.addEventListener('click', goBack);

function updateChrome(){
  const idx = STEP_ORDER.indexOf(currentStep);
  const pct = (idx / (STEP_ORDER.length - 1)) * 100;
  progressFill.style.width = pct + '%';
  backBtn.style.display = historyStack.length > 0 ? 'flex' : 'none';
}

function render(){
  updateChrome();
  switch(currentStep){
    case 'mode': renderMode(); break;
    case 'service': renderService(); break;
    case 'type': renderType(); break;
    case 'otherDetails': renderOtherDetails(); break;
    case 'positioning': renderPositioning(); break;
    case 'sector': renderSector(); break;
    case 'duration': renderDuration(); break;
    case 'count': renderCount(); break;
    case 'usage': renderUsage(); break;
    case 'options': renderOptions(); break;
    case 'final': renderFinal(); break;
  }
}

/* ============================================================
   STEP: MODE
   ============================================================ */

function renderMode(){
  stage.innerHTML = `
    <h2 class="question">Vidéo ou photo ?</h2>
    <p class="question-sub">Deux minutes pour une estimation, aucun engagement.</p>
    <div class="mode-grid">
      <div class="mode-card ${state.mode==='video'?'selected':''}" data-mode="video"><span class="emoji">🎥</span>Vidéo</div>
      <div class="mode-card ${state.mode==='photo'?'selected':''}" data-mode="photo"><span class="emoji">📷</span>Photo</div>
    </div>
    <div class="disclaimer-box">
      ℹ️ Cet outil ne calcule pas de prix : il rassemble les infos de ton projet pour que je te prépare un devis précis et personnalisé, sous 24h.
    </div>
  `;
  stage.querySelectorAll('.mode-card').forEach(card => {
    card.addEventListener('click', () => {
      const newMode = card.dataset.mode;
      if(newMode !== state.mode){
        state = freshState();
        state.mode = newMode;
        state.count = MODE_CONFIG[newMode].includedCount === 1 ? 1 : 20;
      }
      goTo('service');
    });
  });
}

/* ============================================================
   STEP: SERVICE (prestation complète ou montage/retouche seul)
   ============================================================ */

function renderService(){
  const cfg = MODE_CONFIG[state.mode];
  stage.innerHTML = `
    <h2 class="question">${cfg.serviceQuestion}</h2>
    <div class="choice-card ${state.service==='full'?'selected':''}" data-val="full">
      <span>${cfg.serviceFull}<br><span style="font-weight:400;font-size:12.5px;color:var(--muted);">${cfg.serviceFullSub}</span></span>
      <span class="check">✓</span>
    </div>
    <div class="choice-card ${state.service==='shoot_only'?'selected':''}" data-val="shoot_only">
      <span>${cfg.serviceShootOnly}<br><span style="font-weight:400;font-size:12.5px;color:var(--muted);">${cfg.serviceShootOnlySub}</span></span>
      <span class="check">✓</span>
    </div>
    <div class="choice-card ${state.service==='edit_only'?'selected':''}" data-val="edit_only">
      <span>${cfg.serviceEditOnly}<br><span style="font-weight:400;font-size:12.5px;color:var(--muted);">${cfg.serviceEditOnlySub}</span></span>
      <span class="check">✓</span>
    </div>
  `;
  stage.querySelectorAll('.choice-card').forEach(card => {
    card.addEventListener('click', () => {
      state.service = card.dataset.val;
      goTo('type');
    });
  });
}

/* ============================================================
   STEP: TYPE
   ============================================================ */

function goToAfterPositioning(){
  if(state.mode === 'photo' && state.service === 'edit_only'){
    goTo('count'); // retouche seule photo : pas de séance à chiffrer, on charge au nombre de photos
  } else {
    goTo('duration');
  }
}

function renderType(){
  const types = state.mode === 'video' ? VIDEO_TYPES : PHOTO_TYPES;
  const groups = [...new Set(types.map(t => t.group))];
  let html = `<h2 class="question">Quel est ton projet ?</h2>`;
  groups.forEach(g => {
    html += `<div class="group-label">${g}</div>`;
    types.filter(t => t.group === g).forEach(t => {
      html += `<div class="choice-card ${state.type===t.value?'selected':''}" data-value="${t.value}">${t.label}<span class="check">✓</span></div>`;
    });
  });
  stage.innerHTML = html;
  stage.querySelectorAll('.choice-card').forEach(card => {
    card.addEventListener('click', () => {
      state.type = card.dataset.value;
      if(state.type === 'other'){
        goTo('otherDetails');
      } else if(typeNeedsPositioning(state.mode, state.type)){
        goTo('positioning');
      } else {
        goToAfterPositioning();
      }
    });
  });
}

/* ============================================================
   STEP: OTHER DETAILS (uniquement pour "Autre projet / sur-mesure")
   ============================================================ */

function renderOtherDetails(){
  stage.innerHTML = `
    <h2 class="question">Décris ton projet</h2>
    <p class="question-sub">Quelques mots suffisent pour que je comprenne ce que tu as en tête.</p>
    <textarea class="text-input note-textarea" id="otherDetailsInput" placeholder="Ex : vidéo de recrutement pour mon équipe, teaser pour un événement sportif...">${state.otherDetails}</textarea>
    <button type="button" class="btn-primary" id="nextBtn">Suivant</button>
  `;
  const input = document.getElementById('otherDetailsInput');
  input.addEventListener('input', () => { state.otherDetails = input.value; });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if(typeNeedsPositioning(state.mode, state.type)){
      goTo('positioning');
    } else {
      goToAfterPositioning();
    }
  });
}

/* ============================================================
   STEP: POSITIONING (uniquement pour les projets marques & entreprises)
   ============================================================ */

function renderPositioning(){
  let html = `<h2 class="question">Comment situerais-tu la marque ?</h2><p class="question-sub">Un bijoutier haut de gamme et un artisan indépendant n'ont pas le même budget ni la même valeur à défendre, même pour un projet similaire.</p>`;
  POSITIONING_OPTIONS.forEach(p => {
    html += `<div class="choice-card ${state.positioning===p.value?'selected':''}" data-val="${p.value}">${p.label}<span class="check">✓</span></div>`;
  });
  stage.innerHTML = html;
  stage.querySelectorAll('.choice-card').forEach(card => {
    card.addEventListener('click', () => {
      state.positioning = card.dataset.val;
      goTo('sector');
    });
  });
}

/* ============================================================
   STEP: SECTOR (uniquement pour les projets marques & entreprises)
   ============================================================ */

function renderSector(){
  stage.innerHTML = `
    <h2 class="question">Dans quel secteur travailles-tu ?</h2>
    <p class="question-sub">Ex : bijouterie, ébénisterie, restauration, cosmétique, artisanat du bâtiment...</p>
    <input type="text" class="text-input" id="sectorInput" placeholder="Ton secteur d'activité" value="${state.sector}" maxlength="60">
    <button type="button" class="btn-primary" id="nextBtn">Suivant</button>
  `;
  const input = document.getElementById('sectorInput');
  input.addEventListener('input', () => { state.sector = input.value; });
  document.getElementById('nextBtn').addEventListener('click', () => goToAfterPositioning());
}

/* ============================================================
   STEP: DURATION
   ============================================================ */

function renderDuration(){
  const cfg = MODE_CONFIG[state.mode];
  const label = state.service === 'edit_only' ? cfg.durationEditLabel : cfg.durationFullLabel;
  const desc = state.service === 'edit_only' ? cfg.durationEditDesc : cfg.durationFullDesc;
  stage.innerHTML = `
    <h2 class="question">Combien d'heures ${label} ?</h2>
    <p class="question-sub">💡 ${desc}</p>
    <div class="stepper">
      <button type="button" class="stepper-btn" id="stepMinus">–</button>
      <div class="stepper-value" id="stepValue">${state.hours}</div>
      <button type="button" class="stepper-btn" id="stepPlus">+</button>
    </div>
    <div class="stepper-unit">heure(s)</div>
    <p class="duration-convert" id="durationConvert">≈ ${formatDuration(state.hours)}</p>
    <button type="button" class="btn-primary" id="nextBtn">Suivant</button>
  `;

  function updateDisplay(){
    document.getElementById('stepValue').textContent = state.hours;
    document.getElementById('durationConvert').textContent = '≈ ' + formatDuration(state.hours);
  }

  document.getElementById('stepPlus').addEventListener('click', () => {
    state.hours = Math.min(40, state.hours + 1);
    updateDisplay();
  });
  document.getElementById('stepMinus').addEventListener('click', () => {
    state.hours = Math.max(1, state.hours - 1);
    updateDisplay();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    goTo(state.service === 'shoot_only' ? 'usage' : 'count');
  });
}

/* ============================================================
   STEP: COUNT (livrables / photos)
   ============================================================ */

function renderCount(){
  const cfg = MODE_CONFIG[state.mode];
  stage.innerHTML = `
    <h2 class="question">${cfg.countQuestion}</h2>
    <p class="question-sub">${cfg.countSub}</p>
    <div class="stepper">
      <button type="button" class="stepper-btn" id="cMinus">–</button>
      <div class="stepper-value" id="cValue">${state.count}</div>
      <button type="button" class="stepper-btn" id="cPlus">+</button>
    </div>
    <div class="stepper-unit">${cfg.countLabel}</div>
    <button type="button" class="btn-primary" id="nextBtn">Suivant</button>
  `;
  document.getElementById('cPlus').addEventListener('click', () => {
    state.count = Math.min(cfg.countMax, state.count + cfg.countStep);
    document.getElementById('cValue').textContent = state.count;
  });
  document.getElementById('cMinus').addEventListener('click', () => {
    state.count = Math.max(cfg.countMin, state.count - cfg.countStep);
    document.getElementById('cValue').textContent = state.count;
  });
  document.getElementById('nextBtn').addEventListener('click', () => goTo('usage'));
}

/* ============================================================
   STEP: USAGE
   ============================================================ */

function renderUsage(){
  let html = `<h2 class="question">Usage prévu des images ?</h2>`;
  USAGE_OPTIONS.forEach(u => {
    html += `<div class="choice-card ${state.usage===u.value?'selected':''}" data-val="${u.value}">${u.label}<span class="check">✓</span></div>`;
  });
  stage.innerHTML = html;
  stage.querySelectorAll('.choice-card').forEach(card => {
    card.addEventListener('click', () => {
      state.usage = card.dataset.val;
      goTo('options');
    });
  });
}

/* ============================================================
   STEP: OPTIONS
   ============================================================ */

function renderOptions(){
  const allOpts = state.mode === 'video' ? VIDEO_OPTIONS : PHOTO_OPTIONS;
  let opts = allOpts;
  if(state.service === 'edit_only') opts = opts.filter(o => !o.requiresShoot);
  if(state.service === 'shoot_only') opts = opts.filter(o => !o.requiresPost);
  // Ne garder que les options pertinentes pour le type de projet choisi (une option
  // sans liste "types" est considérée universelle ; "other" voit tout, faute de mieux)
  opts = opts.filter(o => !o.types || state.type === 'other' || o.types.includes(state.type));
  let html = `<h2 class="question">Des options en plus ?</h2><p class="question-sub">Sélectionne tout ce qui t'intéresse, ou passe directement à l'estimation.</p>`;
  opts.forEach(o => {
    const priceLabel = o.percent ? `+${o.percent}%` : `+${o.price} €`;
    html += `<div class="choice-card ${state.options.has(o.key)?'selected':''}" data-key="${o.key}">${o.label}<span class="opt-price-tag">${priceLabel}</span></div>`;
  });
  html += `<button type="button" class="btn-primary" id="nextBtn">Voir mon estimation</button>`;
  stage.innerHTML = html;
  stage.querySelectorAll('.choice-card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.key;
      if(state.options.has(key)){ state.options.delete(key); card.classList.remove('selected'); }
      else { state.options.add(key); card.classList.add('selected'); }
    });
  });
  document.getElementById('nextBtn').addEventListener('click', () => goTo('final'));
}

/* ============================================================
   PRICE COMPUTATION
   ============================================================ */

function computePrice(){
  const isVideo = state.mode === 'video';
  const types = isVideo ? VIDEO_TYPES : PHOTO_TYPES;
  const proj = types.find(t => t.value === state.type);
  const cfg = MODE_CONFIG[state.mode];
  // Coefficient régional : Evan exerce en Auvergne-Rhône-Alpes, pas à Paris.
  // Les tarifs journaliers moyens en France sont ~15-25% plus bas qu'à Paris ;
  // on applique -10% aux tarifs de base pour rester cohérent avec le marché régional.
  const dayRate = proj.dayRate * REGIONAL_FACTOR;
  const unitRate = proj.unitRate * REGIONAL_FACTOR;
  const hourlyRate = dayRate / 8;
  const timeCost = state.hours * hourlyRate;

  let base = 0;
  let extra = 0;

  if(state.service === 'edit_only'){
    if(isVideo){
      // Montage seul : le temps saisi représente le volume de rushs à monter, pas un tournage
      base = timeCost * cfg.editOnlyFactor;
      extra = Math.max(0, state.count - cfg.includedCount) * unitRate;
    } else {
      // Retouche seule : pas de séance à chiffrer, tarif au nombre de photos avec un plancher
      base = 0;
      extra = Math.max(state.count * unitRate, MIN_RETOUCH_FORFAIT * REGIONAL_FACTOR);
    }
  } else if(state.service === 'shoot_only'){
    // Tournage/prise de vue seul(e), pas de montage : aucun coût de livrable additionnel
    base = timeCost * cfg.noPostFactor;
    extra = 0;
  } else {
    // Prestation complète : tournage/séance + montage/retouche inclus.
    // Le montage/la retouche est facturé pour chaque livrable dès le premier
    // (avant, le premier livrable était "inclus gratuitement" dans le tarif jour,
    // ce qui sous-évaluait largement le temps de post-production réel).
    base = timeCost;
    extra = state.count * unitRate;
  }

  const usageObj = USAGE_OPTIONS.find(u => u.value === state.usage);
  const needsPositioning = typeNeedsPositioning(state.mode, state.type);
  const positioningObj = needsPositioning ? POSITIONING_OPTIONS.find(p => p.value === state.positioning) : null;
  const positioningMult = positioningObj ? positioningObj.mult : 1;
  const subtotal = (base + extra) * usageObj.mult * positioningMult;

  const opts = isVideo ? VIDEO_OPTIONS : PHOTO_OPTIONS;
  let optionsTotal = 0;
  let rush = false;
  state.options.forEach(key => {
    const opt = opts.find(o => o.key === key);
    if(opt.percent){ rush = true; }
    else { optionsTotal += opt.price; }
  });

  let total = subtotal + optionsTotal;
  if(rush){ total *= 1.2; }

  return {
    low: total * 0.85,
    high: total * 1.15,
    base, extra, usageObj, positioningObj, optionsTotal, rush, proj, total,
  };
}

/* ============================================================
   STEP: FINAL
   ============================================================ */

function buildRecapItems(r){
  const isVideo = state.mode === 'video';
  const cfg = MODE_CONFIG[state.mode];
  const opts = isVideo ? VIDEO_OPTIONS : PHOTO_OPTIONS;
  const checkedOptions = Array.from(state.options).map(key => opts.find(o => o.key === key).label).join(', ') || 'Aucune';
  const durationLabel = formatDuration(state.hours);
  const serviceLabel = state.service === 'full' ? cfg.serviceFull
    : state.service === 'shoot_only' ? cfg.serviceShootOnly
    : cfg.serviceEditOnly;

  const showDuration = state.service !== 'edit_only' || isVideo;
  const showCount = state.service !== 'shoot_only';

  const items = [
    { label: 'Prestation', value: serviceLabel },
    { label: 'Type de projet', value: r.proj.label },
  ];
  if(state.type === 'other' && state.otherDetails.trim()){
    items.push({ label: 'Description du projet', value: state.otherDetails.trim() });
  }
  if(r.positioningObj){
    items.push({ label: 'Positionnement', value: r.positioningObj.label });
  }
  if(state.sector.trim()){
    items.push({ label: "Secteur d'activité", value: state.sector.trim() });
  }
  if(showDuration){
    items.push({ label: state.service === 'edit_only' ? 'Volume de rushs' : 'Durée', value: durationLabel });
  }
  if(showCount){
    items.push({ label: isVideo ? 'Livrables souhaités' : 'Photos retouchées', value: state.count });
  }
  items.push({ label: 'Usage prévu', value: r.usageObj.label });
  items.push({ label: 'Options', value: checkedOptions });
  return items;
}

function buildWaMessage(r){
  const isVideo = state.mode === 'video';
  const items = buildRecapItems(r);
  const lines = items.map(i => `- ${i.label} : ${i.value}`).join('\n');

  return encodeURIComponent(
`Bonjour Evan,

Voici les infos de mon projet ${isVideo ? 'vidéo' : 'photo'} :
${lines}

Merci de me recontacter avec un devis.`
  );
}

function renderFinal(){
  const r = computePrice();
  const waMessage = buildWaMessage(r);
  const recapItems = buildRecapItems(r);

  const recapHtml = recapItems.map(i => `<div class="d-row"><span>${i.label}</span><span>${i.value}</span></div>`).join('');

  stage.innerHTML = `
    <div class="final-hero">
      <div class="final-label">C'est prêt</div>
      <div class="final-confirm">🎬 J'ai toutes les infos pour te préparer un devis sur-mesure.</div>
      <div class="final-sub">Envoie-moi ta demande, je reviens vers toi avec un chiffre précis.</div>
    </div>

    <div class="recap-box">
      <div class="recap-title">📋 Récap de ton projet</div>
      ${recapHtml}
    </div>

    <div class="evan-note">
      🎬 On se lance ? Je réponds personnellement à chaque message sous 24h pour préparer ce devis à ton projet exact. Plus tôt tu me contactes, plus vite on peut caler ta date.
      <div class="evan-signature">Evan</div>
    </div>

    <a class="btn-primary" id="waBtn" href="https://wa.me/33781325185?text=${waMessage}" target="_blank" rel="noopener">💬 Contacter Evan sur WhatsApp</a>
    <div class="final-note">📱 Réponse sous 24h en général · TVA non applicable, art. 293 B du CGI</div>
    <a class="portfolio-link-final" href="https://instagram.com/evanvisions" target="_blank" rel="noopener">Voir le portfolio →</a>
    <div class="restart-link" id="restartLink">Recommencer une estimation</div>
  `;

  document.getElementById('restartLink').addEventListener('click', () => {
    state = freshState();
    historyStack = [];
    currentStep = 'mode';
    render();
  });
}

/* ============================================================
   INIT
   ============================================================ */

render();
</script>
